name: Upload image to platformd
description: Upload a final OCI image archive to a platformd service with GitHub Actions OIDC.
inputs:
  url:
    description: HTTPS origin of the platformd admin hostname, for example https://admin.example.com.
    required: true
  project:
    description: Project name that owns the target service.
    required: true
  resource:
    description: Service name that receives the uploaded image.
    required: true
  archive:
    description: Path to an OCI archive produced by Docker Buildx.
    required: true
  tag:
    description: latest deploys production; every other tag creates a preview.
    default: latest
    required: false
  chunk-size:
    description: >-
      Bytes per HTTP request. Defaults to 95 MiB. Must stay at or below 100 MiB
      because Cloudflare proxies reject larger request bodies.
    default: "99614720"
    required: false
  concurrency:
    description: >-
      Number of part uploads in flight at once (1-8). Defaults to 4.
    default: "4"
    required: false
  github-token:
    description: >-
      Token used to register a GitHub Deployment and, for preview uploads, comment
      the preview URL on an open PR. Defaults to GITHUB_TOKEN when present.
      Needs deployments: write; preview comments also need pull-requests: write.
    default: ${{ github.token }}
    required: false
  environment:
    description: >-
      GitHub Environment name. Defaults to <resource> for latest, or
      <resource>/preview-<tag> otherwise.
    required: false
outputs:
  upload-id:
    description: Stable identifier of this upload.
  deployment-id:
    description: Production deployment or preview identifier.
  digest:
    description: Imported image digest.
  preview-url:
    description: Preview URL for non-latest tags.
  environment-url:
    description: Public URL from platformd (attached service domain for latest, preview URL otherwise).
  logs-url:
    description: Admin UI link to platformd deploy logs for this production or preview deployment.
runs:
  using: node20
  main: dist/index.js
branding:
  icon: upload-cloud
  color: blue
