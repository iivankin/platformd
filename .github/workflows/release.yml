name: Release

# Releases are intentionally manual because publishing also signs immutable assets.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict target SemVer without a leading v
        required: true
        type: string
      supported_from:
        description: Strictly SemVer-sorted comma-separated source versions; empty for the first release
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_TAGS: containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension
  INTEGRATION_TAGS: containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension integration
  SUPPORTED_FROM: ${{ inputs.supported_from }}
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install the locked Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Install the locked Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install native Go dependencies
        run: build/ci-install-native-dependencies.sh go

      - name: Verify locked toolchain versions
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.3"
          test "$(bun --version)" = "1.3.14"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION already exists" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: bun --cwd=_frontend install --frozen-lockfile

      - name: Verify frontend
        run: |
          bun --cwd=_frontend run typecheck
          bun --cwd=_frontend run check
          bun --cwd=_frontend test
          bun --cwd=_frontend run build:web

      - name: Verify image upload action
        run: |
          npm --prefix actions/upload-image ci
          npm --prefix actions/upload-image run check
          ! grep -R --include='*.js' -nE '\brequire\s*\(' actions/upload-image/dist

      - name: Verify port forward action
        run: |
          npm --prefix actions/port-forward ci
          npm --prefix actions/port-forward run check
          ! grep -R --include='*.js' -nE '\brequire\s*\(' actions/port-forward/dist

      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Install Playwright Chromium
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/mxschmitt/playwright-go)
          go run "github.com/mxschmitt/playwright-go/cmd/playwright@$version" install --with-deps chromium

      - name: Verify Go code
        run: |
          go test -race -tags "$GO_TAGS" ./...
          go vet -tags "$GO_TAGS" ./...
          go test -run '^$' -tags "$INTEGRATION_TAGS" ./...
          go test -tags "$INTEGRATION_TAGS" ./internal/mcp

      - name: Fuzz public protocol boundaries
        run: |
          go test -tags "$GO_TAGS" ./internal/internaldns -run '^$' -fuzz '^FuzzDNSInputs$' -fuzztime 10s
          go test -tags "$GO_TAGS" ./internal/ingress -run '^$' -fuzz '^FuzzProxyInputs$' -fuzztime 10s

  build-runtime:
    name: Build bundled runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Restore bundled runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/platformd-runtime.tar
          key: platformd-runtime-linux-amd64-v1-${{ hashFiles('build.lock.json', 'build/runtime-linux-amd64.sh', 'build/verify-elf.sh', 'runtime/**', 'internal/objectstore/sidecar/**', 'telemetry/**') }}

      - name: Install native runtime dependencies
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: build/ci-install-native-dependencies.sh runtime

      - name: Install the locked Rust toolchain
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --no-self-update
          rustup override set 1.97.1

      - name: Verify locked toolchain versions
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          test "$(protoc --version | awk '{print $2}')" = "3.21.12"
          test "gcc-$(gcc -dumpfullversion)" = "gcc-13.3.0"

      - name: Cache Rust build artifacts
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            internal/objectstore/sidecar -> target
            telemetry -> target
          prefix-key: platformd-rust-${{ hashFiles('build.lock.json', 'internal/objectstore/sidecar/Cargo.lock', 'telemetry/Cargo.lock') }}

      - name: Build bundled runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        env:
          PLATFORMD_STRICT_TOOLCHAIN: "1"
        run: build/runtime-linux-amd64.sh

      - name: Archive bundled runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: tar -cf dist/platformd-runtime.tar -C dist runtime

      - name: Verify restored bundled runtime
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: |
          temporary_dir=$(mktemp -d)
          trap 'rm -rf "$temporary_dir"' EXIT
          tar -xf dist/platformd-runtime.tar -C "$temporary_dir"
          build/verify-elf.sh \
            "$temporary_dir/runtime/crun" \
            "$temporary_dir/runtime/conmon" \
            "$temporary_dir/runtime/netavark" \
            "$temporary_dir/runtime/catatonit" \
            "$temporary_dir/runtime/platformd-telemetry" \
            "$temporary_dir/runtime/platformd-objectstore"

      - name: Upload bundled runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platformd-runtime-linux-amd64
          path: dist/platformd-runtime.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify-objectstore:
    name: Verify object storage runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install native runtime dependencies
        run: build/ci-install-native-dependencies.sh runtime

      - name: Install the locked Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --no-self-update
          rustup override set 1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: internal/objectstore/sidecar -> target
          prefix-key: platformd-objectstore-rust-${{ hashFiles('build.lock.json', 'internal/objectstore/sidecar/Cargo.lock') }}

      - name: Test and lint object storage runtime
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=."
          cargo test --release --locked --manifest-path internal/objectstore/sidecar/Cargo.toml
          cargo clippy --release --all-targets --locked --manifest-path internal/objectstore/sidecar/Cargo.toml -- -D warnings

  verify-telemetry:
    name: Verify telemetry runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install native runtime dependencies
        run: build/ci-install-native-dependencies.sh runtime

      - name: Install the locked Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --no-self-update
          rustup override set 1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: telemetry -> target
          prefix-key: platformd-telemetry-rust-${{ hashFiles('build.lock.json', 'telemetry/Cargo.lock') }}

      - name: Test and lint telemetry runtime
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=."
          cargo test --release --locked --manifest-path telemetry/Cargo.toml
          cargo clippy --release --all-targets --locked --manifest-path telemetry/Cargo.toml -- -D warnings

  s3-conformance:
    name: Verify S3 clients
    needs: [validate, build-runtime, verify-objectstore]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install the locked Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Install the locked Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install native Go dependencies
        run: build/ci-install-native-dependencies.sh s3

      - name: Cache pip wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/platformd-pip-cache
          key: platformd-s3-pip-boto3-1.40.18-lancedb-0.34.0

      - name: Download bundled runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platformd-runtime-linux-amd64
          path: dist

      - name: Extract bundled runtime
        run: |
          tar -xf dist/platformd-runtime.tar -C dist
          test -x dist/runtime/platformd-objectstore

      - name: Verify S3 SDK contracts
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/platformd-pip-cache
          PLATFORMD_LANCEDB_SDK_INTEGRATION: "1"
          PLATFORMD_OBJECTSTORE_SIDECAR_BINARY: ${{ github.workspace }}/dist/runtime/platformd-objectstore
          PLATFORMD_S3_SDK_INTEGRATION: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/platformd-s3-python"
          "$RUNNER_TEMP/platformd-s3-python/bin/pip" \
            --disable-pip-version-check \
            install \
            boto3==1.40.18 \
            lancedb==0.34.0
          PATH="$RUNNER_TEMP/platformd-s3-python/bin:$PATH" \
            go test \
              -tags "$INTEGRATION_TAGS" \
              ./internal/objectstore \
              -run 'Test(Boto3S3Contract|LanceDBS3Contract|MinIOStreamingS3Contract|BunS3Contract|RustFSRestoreReplacesObjectsAndMultipartUploads|PublicStoreHeaderCannotReachSiblingBucket|RustFSBucketReconciliationRemovesOrphans)' \
              -count=1 \
              -v

  telemetry-conformance:
    name: Verify telemetry clients
    needs: [validate, build-runtime, verify-telemetry]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install the locked Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Download bundled runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platformd-runtime-linux-amd64
          path: dist

      - name: Extract bundled runtime
        run: |
          tar -xf dist/platformd-runtime.tar -C dist
          test -x dist/runtime/platformd-telemetry

      - name: Verify telemetry client conformance
        env:
          PLATFORMD_TELEMETRY_TEST_API_TOKEN: conformance-read-token
          PLATFORMD_TELEMETRY_TEST_API_URL: http://127.0.0.1:18080/errors
          PLATFORMD_TELEMETRY_TEST_ARTIFACT_TOKEN: conformance-artifact-token
          PLATFORMD_TELEMETRY_TEST_CONFIGURATION_URL: http://127.0.0.1:18080/configuration
          PLATFORMD_TELEMETRY_TEST_SERVICE_ID: tz4a98xxat96iws9zmbrgj3a
        run: |
          telemetry_volume="$RUNNER_TEMP/telemetry-conformance"
          mkdir -p "$telemetry_volume" dist
          # Prebuild the gateway so startup is not racing go compile on a cold runner.
          go build -o dist/telemetry-conformance-gateway ./telemetry/conformance
          PLATFORMD_TELEMETRY_GEOIP_SOURCE=cloudflare \
          PLATFORMD_TELEMETRY_SENTRY_LISTEN=127.0.0.1:18081 \
          PLATFORMD_TELEMETRY_VOLUME="$telemetry_volume" \
            dist/runtime/platformd-telemetry >"$RUNNER_TEMP/telemetry-conformance.log" 2>&1 &
          telemetry_pid=$!
          PLATFORMD_CONFORMANCE_LISTEN=0.0.0.0:18080 \
          PLATFORMD_CONFORMANCE_SERVICE_ID="$PLATFORMD_TELEMETRY_TEST_SERVICE_ID" \
          PLATFORMD_CONFORMANCE_UPSTREAM=http://127.0.0.1:18081 \
            dist/telemetry-conformance-gateway >"$RUNNER_TEMP/telemetry-gateway.log" 2>&1 &
          gateway_pid=$!
          cleanup() {
            kill "$gateway_pid" 2>/dev/null || true
            kill "$telemetry_pid" 2>/dev/null || true
            wait "$gateway_pid" 2>/dev/null || true
            wait "$telemetry_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            if ! kill -0 "$telemetry_pid" 2>/dev/null || ! kill -0 "$gateway_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/telemetry-conformance.log"
              cat "$RUNNER_TEMP/telemetry-gateway.log"
              exit 1
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18080/health >/dev/null || {
            cat "$RUNNER_TEMP/telemetry-conformance.log"
            cat "$RUNNER_TEMP/telemetry-gateway.log"
            exit 1
          }
          ./telemetry/conformance/run.sh

  runtime-integration:
    name: Verify host integration
    needs: [validate, build-runtime, verify-objectstore, verify-telemetry]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install the locked Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Install the locked Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Build embedded frontend
        run: |
          bun --cwd=_frontend install --frozen-lockfile
          bun --cwd=_frontend run build:web

      - name: Install native Go dependencies
        run: build/ci-install-native-dependencies.sh go

      - name: Download bundled runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platformd-runtime-linux-amd64
          path: dist

      - name: Extract bundled runtime
        run: |
          tar -xf dist/platformd-runtime.tar -C dist
          test -x dist/runtime/crun

      - name: Verify private runtime lifecycle and isolation
        run: |
          cleanup_runtime_integration() {
            sudo rm -rf \
              /run/platformd-integration \
              /var/lib/platformd-integration \
              /var/lib/platformd/releases/current
          }
          trap cleanup_runtime_integration EXIT
          go test -c \
            -tags "$INTEGRATION_TAGS" \
            -o dist/containerengine-integration.test \
            ./internal/containerengine
          cleanup_runtime_integration
          sudo mkdir -p /var/lib/platformd/releases/current
          sudo cp -a dist/runtime /var/lib/platformd/releases/current/runtime
          sudo /usr/bin/env \
            HOME=/root \
            PATH=/nonexistent \
            PLATFORMD_FIREWALL_INTEGRATION=1 \
            PLATFORMD_RUNTIME_INTEGRATION=1 \
            dist/containerengine-integration.test \
              -test.timeout=5m \
              -test.v
          sudo systemd-run \
            --quiet \
            --wait \
            --collect \
            --pipe \
            --service-type=exec \
            --unit=platformd-runtime-cgroup-integration \
            --property=Delegate=yes \
            --property=DelegateSubgroup=control \
            --property=TasksMax=infinity \
            --setenv=HOME=/root \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_CGROUP_INTEGRATION=1 \
            --setenv=PLATFORMD_RUNTIME_INTEGRATION=1 \
            "$PWD/dist/containerengine-integration.test" \
              -test.run='^TestDelegatedCgroupPlacementAndLimits$' \
              -test.timeout=3m \
              -test.v

      - name: Verify managed runtimes and privileged host operations
        run: |
          sudo rm -rf /var/lib/platformd/releases/current
          sudo mkdir -p /var/lib/platformd/releases/current
          sudo cp -a dist/runtime /var/lib/platformd/releases/current/runtime
          trap 'sudo rm -rf /var/lib/platformd/releases/current' EXIT

          for package in managedpostgres managedredis daemon rootexec hostterminal portproxy; do
            go test -c \
              -tags "$INTEGRATION_TAGS" \
              -o "dist/$package-integration.test" \
              "./internal/$package"
          done

          run_delegated() {
            local unit="$1"
            local binary="$2"
            local timeout="$3"
            shift 3
            sudo systemd-run \
              --quiet \
              --wait \
              --collect \
              --pipe \
              --service-type=exec \
              --unit="$unit" \
              --property=Delegate=yes \
              --property=DelegateSubgroup=control \
              --property=TasksMax=infinity \
              --setenv=HOME=/root \
              "$@" \
              "$PWD/$binary" \
                -test.timeout="$timeout" \
                -test.v
          }

          run_delegated \
            platformd-managedpostgres-integration \
            dist/managedpostgres-integration.test \
            15m \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_MANAGED_POSTGRES_INTEGRATION=1
          run_delegated \
            platformd-managedredis-integration \
            dist/managedredis-integration.test \
            5m \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_MANAGED_REDIS_INTEGRATION=1
          run_delegated \
            platformd-daemon-runtime-integration \
            dist/daemon-integration.test \
            5m \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_RUNTIME_INTEGRATION=1 \
            --setenv=PLATFORMD_CGROUP_INTEGRATION=1
          sudo rm -rf \
            /var/lib/platformd-hostmesh-parent \
            /var/lib/platformd-hostmesh-child \
            /etc/platformd-hostmesh-parent \
            /etc/platformd-hostmesh-child \
            /run/platformd-hostmesh-parent \
            /run/platformd-hostmesh-child \
            /run/platformd-hostmesh-ipc
          sudo systemd-run \
            --quiet \
            --wait \
            --collect \
            --pipe \
            --service-type=exec \
            --unit=platformd-daemon-host-mesh-integration \
            --property=Delegate=yes \
            --property=DelegateSubgroup=control \
            --property=TasksMax=infinity \
            --setenv=HOME=/root \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_HOST_MESH_INTEGRATION=1 \
            --setenv=PLATFORMD_RUNTIME_INTEGRATION=1 \
            --setenv=PLATFORMD_CGROUP_INTEGRATION=1 \
            "$PWD/dist/daemon-integration.test" \
              -test.run='^TestHostInternalMeshTwoInstances$' \
              -test.timeout=5m \
              -test.v
          run_delegated \
            platformd-rootexec-integration \
            dist/rootexec-integration.test \
            3m \
            --setenv=PLATFORMD_ROOTEXEC_INTEGRATION=1
          run_delegated \
            platformd-hostterminal-integration \
            dist/hostterminal-integration.test \
            3m \
            --setenv=PLATFORMD_HOST_TERMINAL_INTEGRATION=1

          sudo /usr/bin/env \
            PLATFORMD_PORTPROXY_NAMESPACE_INTEGRATION=1 \
            dist/portproxy-integration.test \
              -test.run='^TestNamespaceSocketsStayInsideTargetNamespace$' \
              -test.timeout=1m \
              -test.v

  publish:
    name: Package and publish release
    needs: [s3-conformance, telemetry-conformance, runtime-integration]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install the locked Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Install the locked Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install native Go dependencies
        run: build/ci-install-native-dependencies.sh go

      - name: Build frontend
        run: |
          bun --cwd=_frontend install --frozen-lockfile
          bun --cwd=_frontend run build:web

      - name: Download bundled runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platformd-runtime-linux-amd64
          path: dist

      - name: Extract bundled runtime
        run: |
          tar -xf dist/platformd-runtime.tar -C dist
          test -x dist/runtime/platformd-telemetry
          test -x dist/runtime/platformd-objectstore

      - name: Build self-contained release
        run: |
          CGO_ENABLED=1 go build \
            -trimpath \
            -tags "$GO_TAGS" \
            -ldflags "-X github.com/iivankin/platformd/internal/version.Version=$VERSION -X github.com/iivankin/platformd/internal/version.Commit=$GITHUB_SHA" \
            -o dist/platformd-linux-amd64 \
            .
          build/verify-elf.sh \
            dist/platformd-linux-amd64 \
            dist/runtime/crun \
            dist/runtime/conmon \
            dist/runtime/netavark \
            dist/runtime/catatonit \
            dist/runtime/platformd-telemetry \
            dist/runtime/platformd-objectstore
          go run ./tools/bundle --executable dist/platformd-linux-amd64 --runtime dist/runtime
          python3 -m zipfile -t dist/platformd-linux-amd64

          CGO_ENABLED=1 go build \
            -trimpath \
            -tags "$GO_TAGS platformd_worker" \
            -ldflags "-X github.com/iivankin/platformd/internal/version.Version=$VERSION -X github.com/iivankin/platformd/internal/version.Commit=$GITHUB_SHA" \
            -o dist/platformd-worker-linux-amd64 \
            ./cmd/platformd-worker
          mkdir -p dist/runtime-worker
          for helper in catatonit conmon crun netavark containers.conf mounts.conf policy.json registries.conf seccomp.json storage.conf; do
            cp -a "dist/runtime/$helper" "dist/runtime-worker/$helper"
          done
          test ! -e dist/runtime-worker/platformd-telemetry
          test ! -e dist/runtime-worker/platformd-objectstore
          build/verify-elf.sh \
            dist/platformd-worker-linux-amd64 \
            dist/runtime-worker/crun \
            dist/runtime-worker/conmon \
            dist/runtime-worker/netavark \
            dist/runtime-worker/catatonit
          go run ./tools/bundle --executable dist/platformd-worker-linux-amd64 --runtime dist/runtime-worker
          python3 -m zipfile -t dist/platformd-worker-linux-amd64

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-X github.com/iivankin/platformd/internal/version.Version=$VERSION -X github.com/iivankin/platformd/internal/version.Commit=$GITHUB_SHA" \
              -o "dist/platformd-forward-$os-$arch" \
              ./cmd/platformd-forward
          done

      - name: Verify the same release bytes on Debian 13
        run: |
          rm -rf dist/debian-13-smoke
          mkdir -p dist/debian-13-smoke
          python3 -m zipfile -e dist/platformd-linux-amd64 dist/debian-13-smoke
          chmod 0755 \
            dist/debian-13-smoke/runtime/catatonit \
            dist/debian-13-smoke/runtime/conmon \
            dist/debian-13-smoke/runtime/crun \
            dist/debian-13-smoke/runtime/netavark \
            dist/debian-13-smoke/runtime/platformd-telemetry \
            dist/debian-13-smoke/runtime/platformd-objectstore
          docker run --rm --platform linux/amd64 \
            --volume "$PWD/dist:/release:ro" \
            debian:13-slim@sha256:a617c1cdde36a7e0194b2f07dff669e1753c03c3205356b94f9f350b0f9a57d1 \
            sh -ceu '
              apt-get update
              apt-get install --yes --no-install-recommends \
                libcap2 \
                libgcc-s1 \
                libglib2.0-0t64 \
                libjson-c5 \
                libseccomp2 \
                libstdc++6
              ! command -v nft
              ! command -v iptables
              for helper in catatonit conmon crun netavark platformd-telemetry platformd-objectstore; do
                env -i LC_ALL=C LANG=C "/release/debian-13-smoke/runtime/$helper" --version >/dev/null
              done
              status=0
              /release/platformd-linux-amd64 >/tmp/platformd-output 2>&1 || status=$?
              test "$status" -eq 2
              grep -Fq "usage: platformd init" /tmp/platformd-output
            '
          rm -rf dist/debian-13-worker-smoke
          mkdir -p dist/debian-13-worker-smoke
          python3 -m zipfile -e dist/platformd-worker-linux-amd64 dist/debian-13-worker-smoke
          test ! -e dist/debian-13-worker-smoke/runtime/platformd-telemetry
          test ! -e dist/debian-13-worker-smoke/runtime/platformd-objectstore
          chmod 0755 \
            dist/debian-13-worker-smoke/runtime/catatonit \
            dist/debian-13-worker-smoke/runtime/conmon \
            dist/debian-13-worker-smoke/runtime/crun \
            dist/debian-13-worker-smoke/runtime/netavark
          docker run --rm --platform linux/amd64 \
            --volume "$PWD/dist:/release:ro" \
            debian:13-slim@sha256:a617c1cdde36a7e0194b2f07dff669e1753c03c3205356b94f9f350b0f9a57d1 \
            sh -ceu '
              apt-get update
              apt-get install --yes --no-install-recommends \
                libcap2 \
                libgcc-s1 \
                libglib2.0-0t64 \
                libjson-c5 \
                libseccomp2 \
                libstdc++6
              for helper in catatonit conmon crun netavark; do
                env -i LC_ALL=C LANG=C "/release/debian-13-worker-smoke/runtime/$helper" --version >/dev/null
              done
              status=0
              /release/platformd-worker-linux-amd64 >/tmp/platformd-output 2>&1 || status=$?
              test "$status" -eq 2
              grep -Fq "usage: platformd join" /tmp/platformd-output
              ! grep -Fq "usage: platformd init" /tmp/platformd-output
            '

      - name: Sign release manifest
        env:
          RELEASE_PRIVATE_KEY_B64: ${{ secrets.PLATFORMD_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          test -n "$RELEASE_PRIVATE_KEY_B64"
          key_path="$RUNNER_TEMP/platformd-release-private.pem"
          umask 077
          printf '%s' "$RELEASE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          arguments=(
            --binary dist/platformd-linux-amd64
            --binary-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/platformd-linux-amd64"
            --version "$VERSION"
            --private-key "$key_path"
            --output dist/platformd-linux-amd64.manifest.json
          )
          if [[ -n "$SUPPORTED_FROM" ]]; then
            IFS=',' read -ra source_versions <<< "$SUPPORTED_FROM"
            for source_version in "${source_versions[@]}"; do
              arguments+=(--supported-from "$source_version")
            done
          fi
          go run ./tools/release-manifest "${arguments[@]}"
          worker_arguments=(
            --binary dist/platformd-worker-linux-amd64
            --binary-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/platformd-worker-linux-amd64"
            --version "$VERSION"
            --private-key "$key_path"
            --output dist/platformd-worker-linux-amd64.manifest.json
          )
          if [[ -n "$SUPPORTED_FROM" ]]; then
            IFS=',' read -ra source_versions <<< "$SUPPORTED_FROM"
            for source_version in "${source_versions[@]}"; do
              worker_arguments+=(--supported-from "$source_version")
            done
          fi
          go run ./tools/release-manifest "${worker_arguments[@]}"
          rm -f "$key_path"
          (
            cd dist
            sha256sum \
              platformd-linux-amd64 \
              platformd-linux-amd64.manifest.json \
              platformd-worker-linux-amd64 \
              platformd-worker-linux-amd64.manifest.json \
              platformd-forward-linux-amd64 \
              platformd-forward-linux-arm64 \
              platformd-forward-darwin-amd64 \
              platformd-forward-darwin-arm64 \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            dist/platformd-linux-amd64 \
            dist/platformd-linux-amd64.manifest.json \
            dist/platformd-worker-linux-amd64 \
            dist/platformd-worker-linux-amd64.manifest.json \
            dist/platformd-forward-linux-amd64 \
            dist/platformd-forward-linux-arm64 \
            dist/platformd-forward-darwin-amd64 \
            dist/platformd-forward-darwin-arm64 \
            dist/SHA256SUMS
