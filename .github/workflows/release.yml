name: Release

# Releases are intentionally manual because publishing also signs immutable assets.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict target SemVer without a leading v
        required: true
        type: string
      supported_from:
        description: Strictly SemVer-sorted comma-separated source versions; empty for the first release
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version }}
      SUPPORTED_FROM: ${{ inputs.supported_from }}

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install the locked Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Install the locked Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            curl \
            gcc-13 \
            gperf \
            libcap-dev \
            libglib2.0-dev \
            libjson-c-dev \
            libseccomp-dev \
            libtool \
            meson \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            python3 \
            python3-venv
          mkdir -p "$RUNNER_TEMP/platformd-toolchain"
          ln -s /usr/bin/gcc-13 "$RUNNER_TEMP/platformd-toolchain/gcc"
          echo "$RUNNER_TEMP/platformd-toolchain" >> "$GITHUB_PATH"

      - name: Install the locked Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --no-self-update
          rustup override set 1.97.1

      - name: Verify locked toolchain versions
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.3"
          test "$(bun --version)" = "1.3.14"
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          test "$(protoc --version | awk '{print $2}')" = "3.21.12"
          test "gcc-$(gcc -dumpfullversion)" = "gcc-13.3.0"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION already exists" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: bun --cwd=_frontend install --frozen-lockfile

      - name: Verify frontend
        run: |
          bun --cwd=_frontend run typecheck
          bun --cwd=_frontend run check
          bun --cwd=_frontend test
          bun --cwd=_frontend run build:web

      - name: Verify image upload action
        run: |
          npm --prefix actions/upload-image ci
          npm --prefix actions/upload-image run check
          ! grep -R --include='*.js' -nE '\brequire\s*\(' actions/upload-image/dist

      - name: Verify port forward action
        run: |
          npm --prefix actions/port-forward ci
          npm --prefix actions/port-forward run check
          ! grep -R --include='*.js' -nE '\brequire\s*\(' actions/port-forward/dist

      - name: Verify Go code
        run: |
          go test -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension" ./...
          go test -race -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension" ./...
          go vet -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension" ./...
          go test -run '^$' -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension integration" ./...
          go test -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension integration" ./internal/mcp

      - name: Fuzz public protocol boundaries
        run: |
          go test -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension" ./internal/internaldns -run '^$' -fuzz '^FuzzDNSInputs$' -fuzztime 10s
          go test -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension" ./internal/ingress -run '^$' -fuzz '^FuzzProxyInputs$' -fuzztime 10s

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            internal/objectstore/sidecar -> target
            error-tracker -> target
          prefix-key: platformd-rust-${{ hashFiles('build.lock.json', 'internal/objectstore/sidecar/Cargo.lock', 'error-tracker/Cargo.lock') }}

      - name: Cache pip wheels for S3 SDK checks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/platformd-pip-cache
          key: platformd-s3-pip-boto3-1.40.18-lancedb-0.34.0

      - name: Build and verify bundled runtime
        env:
          PLATFORMD_STRICT_TOOLCHAIN: "1"
        run: build/runtime-linux-amd64.sh

      - name: Verify Rust S3 and SDK conformance
        env:
          # Match build/runtime-linux-amd64.sh so cargo reuses the release target.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
          PIP_CACHE_DIR: ${{ runner.temp }}/platformd-pip-cache
        run: |
          rm -rf "$PWD/.build/runtime-linux-amd64"
          cargo test --release --locked --manifest-path internal/objectstore/sidecar/Cargo.toml
          cargo clippy --release --all-targets --locked --manifest-path internal/objectstore/sidecar/Cargo.toml -- -D warnings
          cargo test --release --locked --manifest-path error-tracker/Cargo.toml
          cargo clippy --release --all-targets --locked --manifest-path error-tracker/Cargo.toml -- -D warnings
          python3 -m venv "$RUNNER_TEMP/platformd-s3-python"
          "$RUNNER_TEMP/platformd-s3-python/bin/pip" \
            --disable-pip-version-check \
            install \
            boto3==1.40.18 \
            lancedb==0.34.0
          PATH="$RUNNER_TEMP/platformd-s3-python/bin:$PATH" \
            PLATFORMD_S3_SDK_INTEGRATION=1 \
            PLATFORMD_LANCEDB_SDK_INTEGRATION=1 \
            PLATFORMD_OBJECTSTORE_SIDECAR_BINARY="$PWD/dist/runtime/platformd-objectstore" \
            go test \
              -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension integration" \
              ./internal/objectstore \
              -run 'Test(Boto3S3Contract|LanceDBS3Contract|MinIOStreamingS3Contract|BunS3Contract|RustFSRestoreReplacesObjectsAndMultipartUploads|PublicStoreHeaderCannotReachSiblingBucket|RustFSBucketReconciliationRemovesOrphans)' \
              -count=1 \
              -v

      - name: Verify Sentry SDK conformance
        env:
          ERROR_TRACKER_ADMIN_TOKEN: release-conformance-admin-token
          ERROR_TRACKER_CONTAINER_URL: http://host.docker.internal:18080
          ERROR_TRACKER_URL: http://127.0.0.1:18080
        run: |
          # Conformance builds many language images; reclaim Docker disk from prior
          # SDK/runtime steps so the runner does not fail with ENOSPC mid-build.
          docker system prune --all --force --volumes
          tracker_volume="$RUNNER_TEMP/error-tracker-conformance"
          mkdir -p "$tracker_volume"
          ERROR_TRACKER_PUBLIC_URL="$ERROR_TRACKER_CONTAINER_URL" \
          ERROR_TRACKER_LISTEN=0.0.0.0:18080 \
          ERROR_TRACKER_VOLUME="$tracker_volume" \
          ERROR_TRACKER_UI_ENABLED=false \
            dist/runtime/platformd-error-tracker >"$RUNNER_TEMP/error-tracker-conformance.log" 2>&1 &
          tracker_pid=$!
          cleanup() {
            kill "$tracker_pid" 2>/dev/null || true
            wait "$tracker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 50); do
            if curl -fsS "$ERROR_TRACKER_URL/health" >/dev/null; then
              break
            fi
            if ! kill -0 "$tracker_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/error-tracker-conformance.log"
              exit 1
            fi
            sleep 0.2
          done
          curl -fsS "$ERROR_TRACKER_URL/health" >/dev/null || {
            cat "$RUNNER_TEMP/error-tracker-conformance.log"
            exit 1
          }
          ./error-tracker/conformance/run.sh

      - name: Verify private runtime lifecycle and isolation
        run: |
          cleanup_runtime_integration() {
            sudo rm -rf \
              /run/platformd-integration \
              /var/lib/platformd-integration \
              /var/lib/platformd/releases/current
          }
          trap cleanup_runtime_integration EXIT
          go test -c \
            -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension integration" \
            -o dist/containerengine-integration.test \
            ./internal/containerengine
          cleanup_runtime_integration
          sudo mkdir -p /var/lib/platformd/releases/current
          sudo cp -a dist/runtime /var/lib/platformd/releases/current/runtime
          sudo /usr/bin/env \
            HOME=/root \
            PATH=/nonexistent \
            PLATFORMD_FIREWALL_INTEGRATION=1 \
            PLATFORMD_RUNTIME_INTEGRATION=1 \
            dist/containerengine-integration.test \
              -test.timeout=5m \
              -test.v
          sudo systemd-run \
            --quiet \
            --wait \
            --collect \
            --pipe \
            --service-type=exec \
            --unit=platformd-runtime-cgroup-integration \
            --property=Delegate=yes \
            --property=DelegateSubgroup=control \
            --property=TasksMax=infinity \
            --setenv=HOME=/root \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_CGROUP_INTEGRATION=1 \
            --setenv=PLATFORMD_RUNTIME_INTEGRATION=1 \
            "$PWD/dist/containerengine-integration.test" \
              -test.run='^TestDelegatedCgroupPlacementAndLimits$' \
              -test.timeout=3m \
              -test.v

      - name: Verify managed runtimes and privileged host operations
        run: |
          sudo rm -rf /var/lib/platformd/releases/current
          sudo mkdir -p /var/lib/platformd/releases/current
          sudo cp -a dist/runtime /var/lib/platformd/releases/current/runtime
          trap 'sudo rm -rf /var/lib/platformd/releases/current' EXIT

          integration_tags="containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension integration"
          for package in managedpostgres managedredis daemon rootexec hostterminal portproxy; do
            go test -c \
              -tags "$integration_tags" \
              -o "dist/$package-integration.test" \
              "./internal/$package"
          done

          run_delegated() {
            local unit="$1"
            local binary="$2"
            local timeout="$3"
            shift 3
            sudo systemd-run \
              --quiet \
              --wait \
              --collect \
              --pipe \
              --service-type=exec \
              --unit="$unit" \
              --property=Delegate=yes \
              --property=DelegateSubgroup=control \
              --property=TasksMax=infinity \
              --setenv=HOME=/root \
              "$@" \
              "$PWD/$binary" \
                -test.timeout="$timeout" \
                -test.v
          }

          run_delegated \
            platformd-managedpostgres-integration \
            dist/managedpostgres-integration.test \
            15m \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_MANAGED_POSTGRES_INTEGRATION=1
          run_delegated \
            platformd-managedredis-integration \
            dist/managedredis-integration.test \
            5m \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_MANAGED_REDIS_INTEGRATION=1
          run_delegated \
            platformd-daemon-runtime-integration \
            dist/daemon-integration.test \
            5m \
            --setenv=PATH=/nonexistent \
            --setenv=PLATFORMD_RUNTIME_INTEGRATION=1 \
            --setenv=PLATFORMD_CGROUP_INTEGRATION=1
          run_delegated \
            platformd-rootexec-integration \
            dist/rootexec-integration.test \
            3m \
            --setenv=PLATFORMD_ROOTEXEC_INTEGRATION=1
          run_delegated \
            platformd-hostterminal-integration \
            dist/hostterminal-integration.test \
            3m \
            --setenv=PLATFORMD_HOST_TERMINAL_INTEGRATION=1

          sudo /usr/bin/env \
            PLATFORMD_PORTPROXY_NAMESPACE_INTEGRATION=1 \
            dist/portproxy-integration.test \
              -test.run='^TestNamespaceSocketsStayInsideTargetNamespace$' \
              -test.timeout=1m \
              -test.v

      - name: Build self-contained release
        run: |
          CGO_ENABLED=1 go build \
            -trimpath \
            -tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension" \
            -ldflags "-X github.com/iivankin/platformd/internal/version.Version=$VERSION -X github.com/iivankin/platformd/internal/version.Commit=$GITHUB_SHA" \
            -o dist/platformd-linux-amd64 \
            .
          build/verify-elf.sh \
            dist/platformd-linux-amd64 \
            dist/runtime/crun \
            dist/runtime/conmon \
            dist/runtime/netavark \
            dist/runtime/catatonit \
            dist/runtime/platformd-error-tracker \
            dist/runtime/platformd-objectstore
          go run ./tools/bundle --executable dist/platformd-linux-amd64 --runtime dist/runtime
          python3 -m zipfile -t dist/platformd-linux-amd64

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-X github.com/iivankin/platformd/internal/version.Version=$VERSION -X github.com/iivankin/platformd/internal/version.Commit=$GITHUB_SHA" \
              -o "dist/platformd-forward-$os-$arch" \
              ./cmd/platformd-forward
          done

      - name: Verify the same release bytes on Debian 13
        run: |
          rm -rf dist/debian-13-smoke
          mkdir -p dist/debian-13-smoke
          python3 -m zipfile -e dist/platformd-linux-amd64 dist/debian-13-smoke
          chmod 0755 \
            dist/debian-13-smoke/runtime/catatonit \
            dist/debian-13-smoke/runtime/conmon \
            dist/debian-13-smoke/runtime/crun \
            dist/debian-13-smoke/runtime/netavark \
            dist/debian-13-smoke/runtime/platformd-error-tracker \
            dist/debian-13-smoke/runtime/platformd-objectstore
          docker run --rm --platform linux/amd64 \
            --volume "$PWD/dist:/release:ro" \
            debian:13-slim@sha256:a617c1cdde36a7e0194b2f07dff669e1753c03c3205356b94f9f350b0f9a57d1 \
            sh -ceu '
              apt-get update
              apt-get install --yes --no-install-recommends \
                libcap2 \
                libgcc-s1 \
                libglib2.0-0t64 \
                libjson-c5 \
                libseccomp2
              ! command -v nft
              ! command -v iptables
              for helper in catatonit conmon crun netavark platformd-error-tracker platformd-objectstore; do
                env -i LC_ALL=C LANG=C "/release/debian-13-smoke/runtime/$helper" --version >/dev/null
              done
              status=0
              /release/platformd-linux-amd64 >/tmp/platformd-output 2>&1 || status=$?
              test "$status" -eq 2
              grep -Fq "usage: platformd init" /tmp/platformd-output
            '

      - name: Sign release manifest
        env:
          RELEASE_PRIVATE_KEY_B64: ${{ secrets.PLATFORMD_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          test -n "$RELEASE_PRIVATE_KEY_B64"
          key_path="$RUNNER_TEMP/platformd-release-private.pem"
          umask 077
          printf '%s' "$RELEASE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          arguments=(
            --binary dist/platformd-linux-amd64
            --binary-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/platformd-linux-amd64"
            --version "$VERSION"
            --private-key "$key_path"
            --output dist/platformd-linux-amd64.manifest.json
          )
          if [[ -n "$SUPPORTED_FROM" ]]; then
            IFS=',' read -ra source_versions <<< "$SUPPORTED_FROM"
            for source_version in "${source_versions[@]}"; do
              arguments+=(--supported-from "$source_version")
            done
          fi
          go run ./tools/release-manifest "${arguments[@]}"
          rm -f "$key_path"
          (
            cd dist
            sha256sum \
              platformd-linux-amd64 \
              platformd-linux-amd64.manifest.json \
              platformd-forward-linux-amd64 \
              platformd-forward-linux-arm64 \
              platformd-forward-darwin-amd64 \
              platformd-forward-darwin-arm64 \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            dist/platformd-linux-amd64 \
            dist/platformd-linux-amd64.manifest.json \
            dist/platformd-forward-linux-amd64 \
            dist/platformd-forward-linux-arm64 \
            dist/platformd-forward-darwin-amd64 \
            dist/platformd-forward-darwin-arm64 \
            dist/SHA256SUMS
