name: Deploy demo

on:
  push:
    branches:
      - "**"
    paths:
      - "_frontend/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (latest deploys production; anything else creates a preview)
        required: true
        default: latest

permissions:
  contents: read
  id-token: write
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_name == 'main' && 'latest' || github.sha) }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build OCI archive
        uses: docker/build-push-action@v7
        with:
          context: _frontend
          file: _frontend/Dockerfile
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/demo.oci
          cache-from: type=gha,scope=platformd-demo
          cache-to: type=gha,mode=max,scope=platformd-demo

      - name: Upload image
        uses: loomatech/platformd-temp/actions/upload-image@v1
        with:
          url: https://platform.looma.llc
          project: platformd
          resource: demo
          archive: ${{ runner.temp }}/demo.oci
          tag: ${{ env.IMAGE_TAG }}
