name: Publish analytics SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict SemVer without a leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-analytics
  cancel-in-progress: false

env:
  GO_TAGS: containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_zfs grpcnotrace seccomp sqlite_omit_load_extension
  VERSION: ${{ inputs.version }}

jobs:
  publish:
    name: Publish @platformd/analytics
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install the locked Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install the locked Node.js toolchain
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install the locked Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Install native Go dependencies
        run: build/ci-install-native-dependencies.sh go

      - name: Verify release inputs and toolchains
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a strict stable SemVer without a leading v" >&2
            exit 1
          fi
          test "$(bun --version)" = "1.3.14"
          test "$(node --version)" = "v24.19.0"
          test "$(go version | awk '{print $3}')" = "go1.26.3"
          npm_version=$(npm --version)
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) process.exit(1);
          ' "$npm_version"

      - name: Install frontend dependencies
        run: bun --cwd=_frontend install --frozen-lockfile

      - name: Verify frontend
        run: |
          bun --cwd=_frontend run typecheck
          bun --cwd=_frontend run check
          bun --cwd=_frontend test

      - name: Build npm package
        run: |
          bun --cwd=_frontend run build:analytics
          node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync("dist/npm/analytics/package.json", "utf8"));
            if (manifest.name !== "@platformd/analytics" || manifest.version !== process.env.VERSION) process.exit(1);
          '
          npm pack --dry-run ./dist/npm/analytics

      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Install Playwright Chromium
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/mxschmitt/playwright-go)
          go run "github.com/mxschmitt/playwright-go/cmd/playwright@$version" install --with-deps chromium

      - name: Verify the built SDK in Chromium
        run: go test -tags "$GO_TAGS" ./internal/analytics -run '^TestAnalyticsSDKBrowserConformance$'

      - name: Publish npm package with trusted publishing
        run: npm publish ./dist/npm/analytics --access public
